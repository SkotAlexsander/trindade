# Dev. Portas só em 127.0.0.1 — nada de banco exposto na rede.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trindade
      POSTGRES_PASSWORD: trindade_dev
      POSTGRES_DB: trindade
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trindade -d trindade']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # MinIO é o S3 de desenvolvimento. Em produção o mesmo código fala com o R2,
  # trocando apenas S3_ENDPOINT/S3_KEY/S3_SECRET. Ver "Decisões" no CLAUDE.md.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: trindade
      MINIO_ROOT_PASSWORD: trindade_dev
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # O SFU. Toda a mídia passa por ele: numa malha ponto a ponto, cada pessoa
  # veria o endereço de todas as outras — ver docs/06-realtime-e-webrtc.md.
  #
  # Portas publicadas uma a uma, e não `network_mode: host`: no Docker Desktop
  # o "host" é a máquina virtual Linux, não o Windows nem o macOS, e a porta
  # fica inalcançável de fora sem nenhum erro que explique isso. Em produção,
  # num Linux de verdade, `network_mode: host` é melhor — evita a tradução de
  # endereço no caminho da mídia.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # O endereço anunciado é o da rede do compose, e **não** 127.0.0.1: com
    # `iceTransportPolicy: 'relay'` a mídia só chega aqui pelo coturn, que roda
    # dentro do Docker e é quem precisa alcançar este endereço. Anunciar
    # 127.0.0.1 faria o relay tentar falar consigo mesmo.
    command: --config /etc/livekit.yaml --node-ip 172.30.0.10
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      # Vinte portas, e **abaixo de 49152**: essa é a faixa dinâmica do
      # Windows, e publicar dentro dela colide com o que o sistema já entregou
      # a outro processo — o erro que aparece é de permissão, e não diz isso.
      # A faixa de produção continua 50000-50200, com `network_mode: host`.
      - '127.0.0.1:40000-40019:40000-40019/udp'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      midia:
        ipv4_address: 172.30.0.10

  # O relay. Sem ele, quem está atrás de CGNAT — metade do Brasil — não fecha
  # conexão de mídia. As linhas `denied-peer-ip` do turnserver.conf não são
  # opcionais: sem elas, este contêiner vira um scanner da rede interna.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # O endereço externo vem do `.env` porque é da máquina, não do projeto: é
    # o que o coturn anuncia no candidato relay, e o navegador precisa
    # alcançá-lo por uma interface de verdade. Ver o comentário no .env.example.
    command: >-
      -c /etc/coturn/turnserver.conf
      --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}/172.30.0.11
    volumes:
      # A de **desenvolvimento**: a de produção não tem como alcançar um SFU
      # com endereço privado, que é onde ele mora nesta máquina. A diferença
      # entre as duas é uma linha `allowed-peer-ip`, e está explicada lá.
      - ./infra/turnserver.dev.conf:/etc/coturn/turnserver.conf:ro
    ports:
      # Publicado **naquela** interface, não em 0.0.0.0: em desenvolvimento o
      # relay fica acessível na rede local, e restringir a uma interface é o
      # mínimo. As credenciais continuam efêmeras e a lista de negados vale.
      - '${TURN_EXTERNAL_IP:-127.0.0.1}:3478:3478'
      - '${TURN_EXTERNAL_IP:-127.0.0.1}:3478:3478/udp'
      - '${TURN_EXTERNAL_IP:-127.0.0.1}:40100-40119:40100-40119/udp'
    networks:
      midia:
        ipv4_address: 172.30.0.11

# Endereços fixos porque a configuração do relay cita o do SFU pelo número: a
# exceção de `allowed-peer-ip` precisa apontar para um endereço que não mude a
# cada `docker compose up`.
networks:
  midia:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  minio_data:
