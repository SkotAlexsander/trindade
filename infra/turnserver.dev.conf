# coturn — **configuração de desenvolvimento**. A de produção é
# `turnserver.conf`, e é ela que vale; esta existe por um motivo só, explicado
# abaixo, e o compose de desenvolvimento é o único lugar que a monta.
#
# O problema: com `iceTransportPolicy: 'relay'` toda a mídia passa pelo relay,
# e o relay precisa alcançar o SFU. Na máquina de desenvolvimento o SFU mora
# num container, com endereço privado — e endereço privado é exatamente o que a
# lista `denied-peer-ip` recusa. Sem uma exceção, a chamada local nunca fecha e
# o requisito central da fase fica sem como ser exercitado.
#
# A exceção é **um endereço**, fixado pelo compose, e nada mais. Todas as
# faixas negadas continuam negadas, inclusive a que contém esse endereço: no
# coturn, `allowed-peer-ip` tem precedência sobre `denied-peer-ip`, então a
# exceção é cirúrgica em vez de abrir a faixa 172.16/12 inteira.

listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=turn_dev_secret_trocar_em_producao
realm=localhost

# O endereço do container nesta rede. O candidato relay, porém, precisa sair
# com o endereço da **máquina**: assim que há permissão de microfone, o Chrome
# liga os sockets ICE às interfaces reais, e um socket ligado a 192.168.x.x não
# alcança o loopback — a alocação no TURN não acontece, e sem erro nenhum.
listening-ip=172.30.0.11
relay-ip=172.30.0.11
# O `external-ip` vem do compose, do `.env`: é o endereço da máquina na rede
# local, e ele muda de máquina para máquina.

min-port=40100
max-port=40119
no-cli
no-multicast-peers

# A exceção, e só ela: o SFU.
allowed-peer-ip=172.30.0.10

# --- e a parte que não é opcional, igual à de produção ----------------------
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
