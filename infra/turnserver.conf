# coturn — o relay. Ver docs/06-realtime-e-webrtc.md, "coturn".
#
# Necessário mesmo com SFU: muita operadora brasileira usa CGNAT, e nesse
# cenário o UDP direto para o SFU frequentemente não fecha. O TURN sobre TLS na
# 5349 passa até em rede corporativa que bloqueia UDP.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=turn_dev_secret_trocar_em_producao
realm=localhost

# Em produção: os certificados reais.
# cert=/etc/letsencrypt/live/turn.exemplo.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.exemplo.com/privkey.pem

# Em produção, 50201-50400. Aqui acompanham o que o compose publica, abaixo da
# faixa dinâmica do Windows.
min-port=40100
max-port=40119
no-cli
no-multicast-peers

# --- e agora a parte que não é opcional ------------------------------------
#
# Sem estas linhas o TURN é um proxy aberto para escanear a **sua própria rede
# interna**: qualquer pessoa com credencial válida — e a credencial é efêmera,
# mas é emitida a todo mundo que entra numa chamada — poderia pedir ao relay
# que abrisse conexão para 10.0.0.x e ler a resposta.
#
# É o mesmo assunto da guarda de SSRF da prévia de link, por outro caminho.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
