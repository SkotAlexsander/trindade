# coturn em **produção**. Ver docs/06-realtime-e-webrtc.md, "coturn".
#
# Necessário mesmo com SFU: muita operadora brasileira usa CGNAT, e nesse
# cenário o UDP direto para o SFU frequentemente não fecha. O TURN sobre TLS na
# 5349 passa até em rede corporativa que bloqueia UDP.
#
# --- este arquivo é um MODELO, e não o que o coturn lê -----------------------
#
# `${...}` é substituído por `scripts/implantar.sh`, que gera
# `infra/turnserver.rendered.conf` a partir daqui e é esse o arquivo que o
# compose monta. O rendered é ignorado pelo git.
#
# A razão é uma só: o coturn não lê variável de ambiente, e a alternativa era
# deixar o segredo escrito num arquivo versionado. Durante um bom tempo foi
# exatamente o que aconteceu aqui — este arquivo trazia um segredo de
# desenvolvimento e `realm` de localhost, com um comentário logo abaixo dizendo
# "em produção, outra coisa". Ele era o de desenvolvimento com o nome do de
# produção, e o compose de produção o montava. `packages/api/test/voz.test.ts`
# agora falha se isso voltar a acontecer.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=${TURN_STATIC_SECRET}
realm=${DOMINIO_TURN}

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# 200 portas: o suficiente para cinco pessoas com vídeo e tela, e uma faixa
# estreita o bastante para caber numa regra de firewall que se lê.
min-port=50201
max-port=50400
no-cli
no-multicast-peers

# --- e agora a parte que não é opcional ------------------------------------
#
# Sem estas linhas o TURN é um proxy aberto para escanear a **sua própria rede
# interna**: qualquer pessoa com credencial válida — e a credencial é efêmera,
# mas é emitida a todo mundo que entra numa chamada — poderia pedir ao relay
# que abrisse conexão para 10.0.0.x e ler a resposta.
#
# É o mesmo assunto da guarda de SSRF da prévia de link, por outro caminho.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
