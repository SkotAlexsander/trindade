packages:
  - 'packages/*'

# argon2 é módulo nativo, esbuild baixa binário e workerd é o runtime de
# Workers que o `wrangler dev` executa: os três precisam rodar script de
# instalação. O pnpm exige a lista explícita — e exige um booleano de verdade
# aqui, não o texto de espaço reservado que ele mesmo escreve na primeira vez.
allowBuilds:
  argon2: true
  esbuild: true
  workerd: true

onlyBuiltDependencies:
  - argon2
  - esbuild
  - workerd
