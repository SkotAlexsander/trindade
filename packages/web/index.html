<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Trindade</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- A fonte que aparece acima da dobra em toda tela. O restante entra por
         font-display: swap, sem bloquear a pintura. -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Num arquivo, e não inline: `script-src 'self'` recusa script inline, e
         abrir `unsafe-inline` anularia a política inteira. Sem `defer`: ele
         precisa rodar antes da primeira pintura. -->
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
